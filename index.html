  let html=`<div class="page"><h1>${esc(s.name)}’s lessons</h1><p class="muted">The way school teaches it: the same models and problem types as the enVision books. ${ROUND} problems a round, no clock, scored.</p>`;
  order.forEach(g=>{html+=`<h2>${M.GRADE_NAMES[g]} <small>${TOPIC_NOTE[g]}</small></h2><div class="tiles">`;
    LESSONS.filter(l=>l.grade===g).forEach(l=>{const b=p.best[l.id];const n=(p.sessions||[]).filter(x=>x.lv===l.id).length;
      html+=`<button class="tile" data-act="ls-open" data-id="${l.id}"><span class="s">${esc(l.topic)}</span><span class="t">${esc(l.title)}</span><span class="foot"><span class="s">${n?n+(n===1?' round':' rounds'):'not started'}</span><span class="grade ${b?'':'empty'}" style="margin-left:auto">${b?b.pct+'%':'–'}</span></span></button>`;});
    html+=`</div>`;});
  return html+`</div>`;
}
function openLesson(id){const l=LBY[id];const s=M.activeStudent();const p=M.getProgress(s.id);const b=p.best[id];const sample=G[l.gens[0]]();
  $('#sheet').innerHTML=`<button class="x" data-act="close-sheet" aria-label="Close">×</button><h3>${esc(l.title)}</h3><p class="muted">${esc(l.topic)}${b?` · best score <span class="grade">${b.pct}%</span>`:''}</p>
  <div class="lsample"><div class="lq small muted">Example</div><div class="lq">${sample.q}</div>${sample.v}</div>
  <div class="row" style="margin-top:14px"><button class="btn big primary" data-act="ls-start" data-id="${id}">Start lesson</button></div>
  <p class="small muted" style="margin-top:10px">${ROUND} problems. A miss shows the strategy and comes back at the end of the round.</p>`;
  M.openSheet();}

let L=null;
function startLesson(id){const l=LBY[id];const s=M.activeStudent();const p=M.getProgress(s.id);
  const q=[];let gi=shuffle(l.gens);for(let i=0;i<ROUND;i++){q.push({p:G[gi[i%gi.length]](),first:true});if((i+1)%gi.length===0)gi=shuffle(l.gens);}
  L={lesson:l,student:s,prog:p,queue:q,idx:0,answered:0,correct:0,missed:[],startedAt:Date.now(),lock:false,blanks:[],bi:0,sel:new Set(),ended:false};
  M.closeSheet();M.state.view='lsession';M.render();show();}
function viewSession(){return `<div class="session"><div class="sbar"><button class="quit" data-act="ls-quit" aria-label="Stop">×</button><span class="title">${esc(L.lesson.title)} · Lesson</span><span class="count" id="lcount"></span></div>
  <div class="sbody"><div class="lstage" id="lstage"></div><div class="pad" id="lpad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key lkey" data-lkey="${n}">${n}</button>`).join('')}<button class="key lkey back" data-lkey="back" aria-label="Backspace">⌫</button><button class="key lkey" data-lkey="0">0</button><button class="key lkey enter" data-lkey="enter" aria-label="Enter">↵</button></div></div></div>`;}
function show(){if(!L||L.idx>=L.queue.length)return endLesson();const it=L.queue[L.idx];const p=it.p;L.cur=it;L.blanks=[];L.bi=0;L.sel=new Set();L.lock=false;
  const c=$('#lcount');if(c)c.textContent=(it.first?'':'again · ')+Math.min(L.answered+1,ROUND)+' of '+ROUND;
  let body=`<div class="lq">${p.q}</div>${p.v}`;
  if(p.kind==='fill'){let bi=0;body+=`<div class="leqs">`+p.lines.map(line=>`<div class="leq">${line.map(seg=>typeof seg==='string'?esc(seg):(L.blanks.push({ans:seg.b,val:''}),`<button class="blank" data-act="ls-blank" data-bi="${bi++}"></button>`)).join('')}</div>`).join('')+`</div>`;}
  else{body+=`<div class="opts">${p.opts.map((o,i)=>`<button class="opt" data-act="ls-opt" data-i="${i}"><span class="ltr">${String.fromCharCode(65+i)}</span>${esc(o.t)}</button>`).join('')}</div>${p.kind==='multi'?`<div class="row" style="margin-top:12px"><button class="btn primary" data-act="ls-check">Check</button></div>`:''}`;}
  body+=`<div class="lfb" id="lfb"></div>`;
  $('#lstage').innerHTML=body;$('#lstage').scrollTop=0;$('#lpad').style.display=p.kind==='fill'?'':'none';paintBlanks();}
function paintBlanks(){document.querySelectorAll('.blank').forEach((el,i)=>{const b=L.blanks[i];el.textContent=b.val;el.classList.toggle('active',i===L.bi&&!L.lock);el.classList.toggle('empty',b.val==='');});}
function lkey(k){if(!L||L.lock||!L.cur||L.cur.p.kind!=='fill')return;const b=L.blanks[L.bi];if(!b)return;
  if(k==='back'){b.val=b.val.slice(0,-1);paintBlanks();return;}
  if(k==='enter'){if(b.val==='')return;advance();return;}
  if(b.val.length>=4||(b.val==='0'&&k==='0'))return;b.val+=k;paintBlanks();
  if(M.roster.settings.autoSubmit!==false&&b.val.length>=String(b.ans).length)advance();}
function advance(){const next=L.blanks.findIndex((b,i)=>i!==L.bi&&b.val==='');if(next>=0){L.bi=next;paintBlanks();}else if(L.blanks.every(b=>b.val!=='')){evaluate(L.blanks.every(b=>parseInt(b.val,10)===b.ans));}else{L.bi=L.blanks.findIndex(b=>b.val==='');paintBlanks();}}
function evaluate(ok){const it=L.cur,p=it.p;L.lock=true;
  if(it.first){L.answered++;if(ok)L.correct++;else L.missed.push(p);}
  if(p.kind==='fill'){document.querySelectorAll('.blank').forEach((el,i)=>{const b=L.blanks[i];el.classList.remove('active');const good=parseInt(b.val,10)===b.ans;el.classList.add(good?'good':'bad');if(!good)el.insertAdjacentHTML('afterend',`<span class="fix">${b.ans}</span>`);});}
  else{document.querySelectorAll('.opt').forEach((el,i)=>{const o=p.opts[i];const picked=L.sel.has(i);if(o.ok)el.classList.add('good');if(picked&&!o.ok)el.classList.add('bad');el.disabled=true;});}
  const fb=$('#lfb');
  if(ok){fb.innerHTML=`<div class="mark ok"><svg viewBox="0 0 100 100"><path d="M18 54 L42 76 L84 26"/></svg></div>`;setTimeout(()=>{if(!L)return;L.idx++;show();},700);}
  else{fb.innerHTML=`<div class="lhint">${esc(p.hint)}</div><button class="btn primary" data-act="ls-next">Next</button>`;if(it.first)L.queue.push({p,first:false});}
}
function pickOpt(i){if(!L||L.lock)return;const p=L.cur.p;if(p.kind==='choice'){L.sel=new Set([i]);document.querySelectorAll('.opt')[i].classList.add('picked');evaluate(!!p.opts[i].ok);}
  else{if(L.sel.has(i))L.sel.delete(i);else L.sel.add(i);document.querySelectorAll('.opt').forEach((el,j)=>el.classList.toggle('picked',L.sel.has(j)));}}
function checkMulti(){if(!L||L.lock)return;const p=L.cur.p;const ok=p.opts.every((o,i)=>!!o.ok===L.sel.has(i));evaluate(ok);}
function endLesson(partial){if(!L||L.ended)return;L.ended=true;const p=L.prog,l=L.lesson;const total=L.answered,correct=L.correct;const pct=total?Math.round(100*correct/total):0;const secs=Math.round((Date.now()-L.startedAt)/1000);
  const rec={id:M.uid(),ts:Date.now(),lv:l.id,mode:'lesson',total,answered:total,correct,secs,limit:0,pct,missed:[],partial:!!partial};
  p.sessions.push(rec);if(p.sessions.length>M.SESSION_CAP)p.sessions=p.sessions.slice(-M.SESSION_CAP);
  let newBest=false;const b=p.best[l.id];const cand={pct,secs,ts:rec.ts};if(!b||M.better(cand,b)){p.best[l.id]=cand;newBest=true;}
  M.saveProgress(L.student.id);L.result={rec,newBest};M.state.view='lresults';M.render();}
function viewResults(){const {rec,newBest}=L.result;const l=L.lesson;
  return `<div class="page"><h1>${esc(l.title)} · Lesson</h1><div class="report"><div class="biggrade">${rec.pct}%</div><div class="line1">${rec.correct} of ${rec.total} right on the first try</div><div class="line2">${rec.total} problems in ${M.fmtTime(rec.secs)}${rec.partial?' (stopped early)':''}</div><div class="line3">${newBest?'<span class="best">New best for this lesson</span>':''}</div></div>
  ${L.missed.length?`<h2>Missed <small>the strategy to remember</small></h2>${L.missed.map(p=>`<div class="lmiss"><div>${p.q}</div><div class="lhint">${esc(p.hint)}</div></div>`).join('')}`:'<p class="muted">Nothing missed.</p>'}
  ${M.tonightStrip(L.prog)}
  <div class="row" style="margin-top:18px"><button class="btn big primary" data-act="ls-start" data-id="${l.id}">Do it again</button><button class="btn big" data-act="nav" data-view="lessons">All lessons</button></div>
  <div class="row" style="margin-top:12px"><button class="btn" data-act="nav" data-view="progress">Progress</button></div></div>`;}
async function quitLesson(){if(!L)return;const ok=await M.confirmModal('Stop this lesson?','Stop',true);if(!ok)return;if(L.answered>=3){endLesson(true);return;}M.saveProgress(L.student.id);L=null;M.state.view='lessons';M.render();}

window.MF_VIEWS={lessons:viewLessons,lsession:viewSession,lresults:viewResults};
if(window.MF_VIEWS[M.state.view])M.render();
window.MF_PROGRESS_EXTRA=function(p){const done=LESSONS.filter(l=>p.best[l.id]);if(!done.length)return `<h2>Lessons</h2><p class="muted">No lesson rounds yet. They are on the Lessons tab.</p>`;
  return `<h2>Lessons <small>best score per lesson</small></h2><div class="chips">${done.map(l=>`<span class="chip">${esc(l.title)} <span class="grade" style="margin-left:4px">${p.best[l.id].pct}%</span></span>`).join('')}</div>`;};

document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(a==='ls-open')openLesson(el.dataset.id);
  else if(a==='ls-start'){L=null;startLesson(el.dataset.id);}
  else if(a==='ls-quit')quitLesson();
  else if(a==='ls-blank'){if(L&&!L.lock){L.bi=Number(el.dataset.bi);paintBlanks();}}
  else if(a==='ls-opt')pickOpt(Number(el.dataset.i));
  else if(a==='ls-check')checkMulti();
  else if(a==='ls-next'){if(L){L.idx++;show();}}
  else if(a==='nav'){if(M.state.view!=='lsession')L=null;}
});
document.addEventListener('pointerdown',e=>{const k=e.target.closest('.lkey');if(!k)return;e.preventDefault();k.classList.add('down');lkey(k.dataset.lkey);});
document.addEventListener('keydown',e=>{if(!L||M.state.view!=='lsession')return;if(/^[0-9]$/.test(e.key)){lkey(e.key);e.preventDefault();}else if(e.key==='Backspace'){lkey('back');e.preventDefault();}else if(e.key==='Enter'){if(L.cur&&L.cur.p.kind==='multi'&&!L.lock)checkMulti();else lkey('enter');e.preventDefault();}});

const SB={url:'https://tpaxwgtbuaptivcqtzjm.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRwYXh3Z3RidWFwdGl2Y3F0emptIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM1Mzk5MTIsImV4cCI6MjA5OTExNTkxMn0.dO4ia9J5stw0XJZRy6_6QVWgTD8RZ3rl1hbpXYcUVz8',table:'math_facts_docs'};
let family=(M.loadJSON('mathfacts.family')||{}).code||'';let syncMsg='';
const hdr=()=>({'apikey':SB.key,'Authorization':'Bearer '+SB.key,'Content-Type':'application/json','x-family':family});
async function push(id,data){if(!family||typeof fetch!=='function')return;try{const r=await fetch(`${SB.url}/rest/v1/${SB.table}`,{method:'POST',headers:Object.assign(hdr(),{'Prefer':'resolution=merge-duplicates,return=minimal'}),body:JSON.stringify([{id:family+':'+id,family,data,updated_at:data.updatedAt||Date.now()}])});syncMsg=r.ok?'Synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'}):'Sync failed ('+r.status+')';}catch(e){syncMsg='Sync failed (offline?)';}note();}
async function pull(){if(!family||typeof fetch!=='function')return;try{const r=await fetch(`${SB.url}/rest/v1/${SB.table}?family=eq.${encodeURIComponent(family)}&select=id,data`,{headers:hdr()});if(!r.ok){syncMsg='Sync failed ('+r.status+')';note();return;}const rows=await r.json();let changed=false;
    rows.forEach(row=>{const key=row.id.slice(family.length+1);
      if(key==='roster'){const rem=row.data;if((rem.updatedAt||0)>(M.roster.updatedAt||0)){M.setRoster(rem);changed=true;}else if((M.roster.updatedAt||0)>(rem.updatedAt||0))push('roster',M.roster);}
      else if(key.startsWith('progress:')){const sid=key.slice(9);const local=M.getProgress(sid);const before=JSON.stringify(local);const merged=M.mergeProgress(local,row.data);Object.assign(local,merged);M.saveJSON(M.LS.progress(sid),local);if(JSON.stringify(local)!==before)changed=true;if(JSON.stringify(local)!==JSON.stringify(row.data))push('progress:'+sid,local);}});
    const have=new Set(rows.map(r=>r.id));M.roster.students.forEach(s=>{const p=M.getProgress(s.id);if(!have.has(family+':progress:'+s.id)&&p.updatedAt>0)push('progress:'+s.id,p);});
    if(!have.has(family+':roster')&&M.roster.updatedAt>0)push('roster',M.roster);
    syncMsg='Synced '+new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});note();
    const v=M.state.view;if(changed&&(v==='progress'||v==='levels'||v==='lessons'))M.render();}catch(e){syncMsg='Sync failed (offline?)';note();}}
function note(){const el=$('#familynote');if(el)el.textContent=family?syncMsg||'Sync code set.':'';}
window.MF_ONSAVE=function(kind,id,data){if(!family)return;push(kind==='roster'?'roster':'progress:'+id,data);};
window.MF_SETUP_EXTRA=function(){return `<div class="field"><div class="lab">Family sync code<small>Type the same word on every tablet and phone (6+ letters) and progress, calendars and scores stay in step across all of them.</small></div><div class="row"><input type="text" id="familyin" value="${esc(family)}" placeholder="e.g. fitzmath" maxlength="32" autocapitalize="off" autocorrect="off"><button class="btn sm" data-act="ls-family">Save</button></div></div><p class="sync" id="familynote">${family?esc(syncMsg||'Sync code set.'):''}</p>`;};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act="ls-family"]');if(!el)return;const v=($('#familyin').value||'').trim().toLowerCase().replace(/[^a-z0-9-]/g,'');if(v.length<6){syncMsg='Use at least 6 letters or numbers.';family='';M.saveJSON('mathfacts.family',{code:''});note();return;}family=v;M.saveJSON('mathfacts.family',{code:v});syncMsg='Connecting…';note();pull();});
if(family){pull();setInterval(()=>{if(!document.hidden)pull();},45000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull();});}
})();
